
name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: nextjs-production
  cancel-in-progress: false

jobs:
  security-and-build:
    name: Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Secret / credential leak detection
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: security-and-build

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true

          script: |
            set -e

            echo "================================="
            echo "Starting Next.js deployment"
            echo "================================="

            cd /var/www/ambrhomes/frontend

            echo "Fetching latest code..."
            git fetch origin main

            echo "Resetting to latest main..."
            git reset --hard origin/main

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Building Next.js..."
            npm run build

            echo "Restarting PM2..."
            pm2 reload ambrhomes-frontend --update-env

            echo "Checking PM2 status..."
            pm2 status

            echo "================================="
            echo "Deployment completed successfully"
            echo "================================="

